    timeout: 10
    retries: 1
  artifacts:
    Crash Dumps:
      paths:
      - CrashDumps/**
    logs:
      paths:
      - '*.log'
      - '*.xml'
      - upm-ci~/test-results/**/*
      - upm-ci~/temp/*/Logs/**
      - upm-ci~/temp/*/Library/*.log
      - upm-ci~/temp/*/*.log
      - upm-ci~/temp/Builds/*.log
    packages:
      paths:
      - upm-ci~/packages/**/*
    PreviewAPVResults:
      paths:
      - PreviewApvArtifacts~/**
    pvp-results:
      paths:
      - upm-ci~/pvp/**/*
      browsable: onDemand
  dependencies:
  - path: .yamato/wrench/package-pack-jobs.yml#package_pack_-_2d_tilemap_extras
  variables:
    UPMPVP_CONTEXT_WRENCH: 0.10.14.0
