  agent:
    image: package-ci/macos-13:default
    type: Unity::VM::osx
    flavor: b1.xlarge
  commands:
  - command: curl https://artifactory.prd.it.unity3d.com/artifactory/stevedore-unity-internal/wrench-localapv/1-2-33_105495e06e2db0212292b17be163941e922098743472bf73bdc0678491b98575.zip -o wrench-localapv.zip
  - command: 7z x wrench-localapv.zip
  - command: python PythonScripts/print_machine_info.py
  - command: npm install upm-ci-utils@stable -g --registry https://artifactory.prd.cds.internal.unity3d.com/artifactory/api/npm/upm-npm
    timeout: 20
    retries: 10
  - command: unity-downloader-cli -u 2021.3 -c Editor --fast
    timeout: 10
    retries: 3
  - command: python PythonScripts/preview_apv.py --wrench-config=.yamato/wrench/wrench_config.json --editor-version=2021.3 --testsuite=editor,playmode --artifacts-path=PreviewApvArtifacts~
